[tool.poetry]
name = "host-check-tool"
version = "0.6.0"
description = "Local-first Linux host resource diagnosis (procdiag): record CPU/memory/disk over time, then explain what to fix."
authors = ["hardwork9047 <tomatosimple1104@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/mikawa-bushi/host-check-tool"
repository = "https://github.com/mikawa-bushi/host-check-tool"
documentation = "https://github.com/mikawa-bushi/host-check-tool/blob/main/docs/procdiag.md"
keywords = ["linux", "monitoring", "diagnostics", "psi", "cgroup", "procdiag", "cli", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
packages = [{ include = "procdiag" }]
include = [
    "procdiag/diagnosis/templates/*",
]

[tool.poetry.dependencies]
python = "^3.10"
psutil = "^7.0"
pydantic = "^2.7"
jinja2 = "^3.1"
click = "^8.1"

[tool.poetry.scripts]
procdiag = "procdiag.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
black = "^26.0"
pre-commit = "^4.6.0"
# ruff は pre-commit (v0.15 系) と同系列に固定し、CI・手元・pre-commit で版を揃える。
ruff = "^0.15.17"
# カバレッジ計測 (poetry run pytest --cov=procdiag) を可能にする。
pytest-cov = "^5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py310"]

# ruff は import 整列(I)と pyflakes(F: 未使用 import/変数・未定義名)に限定。
# 整形は black が担うため、スタイル系の規則は入れずリポジトリ方針(black中心)に合わせる。
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["I", "F"]

[tool.ruff.lint.per-file-ignores]
# 利用者向けの設定テンプレート: コメントアウト例 (WatchDir など) のために
# 未使用の import を意図的に残している。
"config.py" = ["F401"]
"examples/*.config.py" = ["F401"]

[tool.pytest.ini_options]
markers = [
    "real_proc: 実マシンの /proc に対して実行するスモークテスト",
    "e2e: record→check を通しで実行する統合テスト",
]

[tool.coverage.run]
source = ["procdiag"]
branch = true

[tool.coverage.report]
show_missing = true
