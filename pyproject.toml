[tool.poetry]
name = "host-check-tool"
version = "0.2.0"
description = "Local-first Linux host resource diagnosis (procdiag): record CPU/memory/disk over time, then explain what to fix."
authors = ["hardwork9047 <tomatosimple1104@gmail.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/mikawa-bushi/host-check-tool"
repository = "https://github.com/mikawa-bushi/host-check-tool"
documentation = "https://github.com/mikawa-bushi/host-check-tool/blob/main/docs/procdiag.md"
keywords = ["linux", "monitoring", "diagnostics", "psi", "cgroup", "procdiag", "cli", "sysadmin"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
packages = [{ include = "procdiag" }]
include = [
    "procdiag/diagnosis/templates/*",
]

[tool.poetry.dependencies]
python = "^3.10"
psutil = "^7.0"
pydantic = "^2.7"
jinja2 = "^3.1"
click = "^8.1"

[tool.poetry.scripts]
procdiag = "procdiag.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
black = "^26.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
markers = [
    "real_proc: 実マシンの /proc に対して実行するスモークテスト",
    "e2e: record→check→report を通しで実行する統合テスト",
]
