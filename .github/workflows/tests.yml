name: CI

# Formatting (black), lint (ruff) and the full pytest suite in one workflow,
# kept to two short jobs per push.
on:
  push:
    branches:
      - '**'  # '*' would not match branch names containing '/'
    paths-ignore:  # documentation-only pushes cannot change test results
      - '**.md'
      - 'docs/**'
      - 'plans/**'
      - 'tasks/**'
      - 'LICENSE'
  # No pull_request trigger: PR branches live in this repo, so their pushes
  # already run above and a second trigger would double the minutes.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung test would otherwise run up to the 6 h job limit.
    timeout-minutes: 10
    name: pytest (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported versions (pyproject: python = "^3.10").
        python-version: ['3.10', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache Poetry dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-tests-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

    # Installs runtime + dev dependencies and the package itself, so the
    # ``procdiag`` console script used by the E2E tests is on the venv PATH.
    - name: Install dependencies
      run: poetry install

    # Formatting does not depend on the Python version; check it once.
    # Fix locally with ``black .`` (or the pre-commit hook).
    - name: Check formatting (black)
      if: matrix.python-version == '3.14'
      run: poetry run black --check --diff .

    - name: Lint (ruff)
      run: poetry run ruff check .

    - name: Run tests
      # 92% at the time of writing; the margin absorbs runner differences
      # (e.g. no readable journal / systemd in the CI container).
      run: poetry run pytest -q --cov=procdiag --cov-report=term-missing:skip-covered --cov-fail-under=85
