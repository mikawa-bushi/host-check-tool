name: Publish to PyPI

# Pushing a tag vX.Y.Z publishes that commit to PyPI with trusted publishing
# (OIDC), so no PyPI token is stored anywhere. Release steps:
#   1. bump pyproject.toml version + procdiag.__version__, date the CHANGELOG
#   2. commit and push to main, wait for CI to pass (the build job refuses a
#      commit without a successful CI run)
#   3. git tag -a vX.Y.Z -m "host-check-tool X.Y.Z" && git push origin vX.Y.Z
# PyPI must list this repository, publish.yml and the "pypi" environment as a
# trusted publisher (project settings > Publishing). If the publish job fails,
# fix the cause and use "Re-run failed jobs": files already on PyPI are skipped.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read  # to look up the CI result for the tagged commit
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # the tag check needs origin/main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check the tag matches the version and is on main
      run: |
        version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["poetry"]["version"])')
        if [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $version"
          exit 1
        fi
        if ! git merge-base --is-ancestor HEAD origin/main; then
          echo "::error::$GITHUB_REF_NAME is not on main"
          exit 1
        fi

    - name: Check CI passed for the tagged commit
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        sha=$(git rev-parse HEAD)
        passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --commit "$sha" --status success --json databaseId --jq length)
        if [ "$passed" -eq 0 ]; then
          echo "::error::no successful CI run for $sha. Wait for CI to pass (or start it with: gh workflow run tests.yml --ref main), then re-run this workflow"
          exit 1
        fi

    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade build twine
        python -m build
        python -m twine check --strict dist/*

    - name: Smoke-test the wheel
      run: |
        python -m venv "$RUNNER_TEMP/smoke"
        "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
        "$RUNNER_TEMP/smoke/bin/procdiag" --version | grep -F "${GITHUB_REF_NAME#v}"

    - name: Upload dist
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write  # only the job that uploads can mint a PyPI credential
    steps:
    - name: Download dist
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
        # Attestations are signed into the public Sigstore log, which would
        # expose this private repo's workflow and commit details. Turn them
        # on if the repository becomes public.
        attestations: false
